# Render Blueprint — provisions the free-tier stack (API + frontend).
#
# Database is NOT provisioned here: it runs on Neon (neon.com), a
# free-forever Postgres provider — Render's own Postgres free tier expires
# after 30 days, which doesn't work for a real deployment. Create a Neon
# project first and paste its connection string into DATABASE_URL when
# Render prompts for it (sync: false below means Render asks at apply
# time rather than baking a placeholder into the file).
#
# Apply via Render dashboard -> New -> Blueprint, pointing at this repo
# (github.com/imnexus-ship-it/BoaFie-Api).

services:
  - name: boafie-api
    type: web
    runtime: node
    plan: free
    region: oregon
    # --include=dev is required here: NODE_ENV=production below would
    # otherwise make `npm ci` skip devDependencies, which is where
    # @nestjs/cli (the `nest` build command) and typescript live.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Render's own predictable domain for the boafie-web service below —
      # if that service ends up on a different hostname (e.g. name
      # collision), update this manually in the Render dashboard.
      - key: CORS_ORIGIN
        value: https://boafie-web.onrender.com
      # Google needs no secret (only ID tokens are verified, never
      # exchanged), Yahoo needs both since it's a server-side code
      # exchange. Leave blank to keep that provider disabled.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        value: https://boafie-api.onrender.com/v1/auth/yahoo/callback

  - name: boafie-web
    type: web
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/imnexus-ship-it/BoaFie-Web.git
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Same caveat as CORS_ORIGIN above, mirrored.
      - key: NEXT_PUBLIC_API_URL
        value: https://boafie-api.onrender.com/v1
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
